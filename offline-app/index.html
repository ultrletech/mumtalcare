<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mumtal Care - Offline</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

* { box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #fdf6f0 0%, #fef9f5 50%, #fdf0e8 100%);
    margin: 0;
    padding: 1.5rem;
    max-width: 600px;
    margin: 0 auto;
}
.hero {
    background: linear-gradient(135deg, #8B4513 0%, #A0522D 40%, #CD853F 100%);
    border-radius: 20px;
    padding: 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
    color: white;
}
.hero h1 { margin: 0; font-size: 2rem; }
.hero p { margin: 0.5rem 0 0; opacity: 0.9; font-size: 0.9rem; }
.offline-badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    margin-top: 0.5rem;
}
.section-card {
    background: white;
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    box-shadow: 0 2px 16px rgba(139, 69, 19, 0.08);
}
.section-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: #A0522D;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 1rem;
}
label {
    display: block;
    font-size: 0.9rem;
    color: #374151;
    margin-bottom: 0.4rem;
    margin-top: 1rem;
    font-weight: 500;
}
select, input {
    width: 100%;
    padding: 0.7rem;
    border-radius: 10px;
    border: 1px solid rgba(139,69,19,0.2);
    background: #1a1a2e;
    color: white;
    font-size: 0.95rem;
}
button {
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 0.9rem;
    font-weight: 600;
    font-size: 1rem;
    width: 100%;
    margin-top: 1.5rem;
    cursor: pointer;
}
button:disabled { background: #d1d5db; cursor: not-allowed; }
#result {
    margin-top: 1rem;
    padding: 1.5rem;
    border-radius: 16px;
    display: none;
}
.result-low { background: #dcfce7; border-left: 5px solid #16a34a; }
.result-medium { background: #fef3c7; border-left: 5px solid #d97706; }
.result-high { background: #ffe4e6; border-left: 5px solid #dc2626; }
#result h3 { margin: 0 0 0.5rem; }
</style>
</head>
<body>

<div id="install-banner" style="
  display: none;
  position: fixed;
  top: 16px;
  right: 16px;
  width: 280px;
  background-color: #8B4513;
  color: white;
  padding: 16px;
  border-radius: 12px;
  font-family: sans-serif;
  z-index: 9999;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  box-sizing: border-box;
">
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px;">
    <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.3; white-space: normal; word-break: normal; overflow-wrap: normal;">
      Install App
    </span>
    <button id="dismiss-button" type="button" style="
      background: transparent !important;
      border: none !important;
      color: white !important;
      font-size: 16px !important;
      cursor: pointer;
      padding: 0 !important;
      line-height: 1;
      flex-shrink: 0;
    ">✕</button>
  </div>
  <p style="font-size: 12px; margin: 0 0 10px 0; opacity: 0.9;">Works fully offline, no internet needed</p>
  <button id="install-button" type="button" style="
    width: 100%;
    background-color: #ffffff;
    color: #8B4513;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
  ">Install</button>
</div>

<div class="hero">
    <h1>Mumtal Care</h1>
    <p>Postpartum Depression Risk Screener</p>
    <div class="offline-badge">📴 Works fully offline</div>
</div>

<div class="section-card">
    <p class="section-title">Mother's Information</p>

    <label>Age of mother</label>
    <input type="number" id="age" min="13" max="55" placeholder="Enter age">

    <label>Marital / relationship status</label>
    <select id="marital">
        <option value="">Select</option>
        <option value="0">Single / No partner</option>
        <option value="1">Married / Has partner</option>
    </select>

    <label>Partner or family support level</label>
    <select id="support">
        <option value="">Select</option>
        <option value="0">None</option>
        <option value="1">Little</option>
        <option value="2">Moderate</option>
        <option value="3">Strong</option>
    </select>

    <label>Was the pregnancy planned?</label>
    <select id="planned">
        <option value="">Select</option>
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select>

    <label>History of depression or mental illness?</label>
    <select id="mental">
        <option value="">Select</option>
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select>

    <label>Previous miscarriage or pregnancy loss?</label>
    <select id="loss">
        <option value="">Select</option>
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select>

    <label>Baby's birth weight</label>
    <select id="lbw">
        <option value="">Select</option>
        <option value="0">Normal birth weight</option>
        <option value="1">Low birth weight</option>
    </select>

    <label>Self-reported mood (past 2 weeks)</label>
    <select id="mood">
        <option value="">Select</option>
        <option value="0">Very low</option>
        <option value="1">Low</option>
        <option value="2">Mostly okay</option>
        <option value="3">Good</option>
    </select>

    <label>Sleep quality since birth</label>
    <select id="sleep">
        <option value="">Select</option>
        <option value="0">Very poor</option>
        <option value="1">Poor</option>
        <option value="2">Okay</option>
    </select>

    <label>Weeks since delivery</label>
    <select id="weeks">
        <option value="">Select</option>
        <option value="0">0–2 weeks</option>
        <option value="1">3–6 weeks</option>
        <option value="2">6–12 weeks</option>
        <option value="3">12+ weeks</option>
    </select>

    <button id="assessBtn" disabled>Assess Risk</button>
</div>

<div id="result"></div>

<script src="ort.min.js"></script>
<script>
ort.env.wasm.wasmPaths = './';
</script>
<script src="app.js"></script>
<script>
  // Only try this if the browser supports service workers (all modern mobile browsers do).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((registration) => {
          console.log('[App] Service worker registered:', registration.scope);
        })
        .catch((error) => {
          console.error('[App] Service worker registration failed:', error);
        });
    });
  }
</script>
<script>
  // This will hold the browser's install prompt event so we can trigger it later,
  // when the user clicks our custom "Install" button.
  let deferredInstallPrompt = null;

  const installBanner = document.getElementById('install-banner');
  const installButton = document.getElementById('install-button');
  const dismissButton = document.getElementById('dismiss-button');

  // 'beforeinstallprompt' fires automatically when Chrome decides the app
  // is installable (correct manifest.json, service worker registered, served over HTTPS or localhost).
  window.addEventListener('beforeinstallprompt', (event) => {
    // Stop Chrome's default mini-infobar from showing —
    // we want to show OUR custom banner instead.
    event.preventDefault();

    // Save the event so we can trigger it later, when the user clicks our button.
    deferredInstallPrompt = event;

    // Don't show the banner immediately — wait a few seconds so it doesn't
    // feel like a popup ad the moment the page loads.
    setTimeout(() => {
      // Only show it if the user hasn't already dismissed it this session.
      if (!sessionStorage.getItem('installBannerDismissed')) {
        installBanner.style.display = 'block';
      }
    }, 4000); // 4 seconds — adjust this number if you want it sooner/later
  });

  // When the user clicks our custom "Install" button:
  installButton.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;

    installBanner.style.display = 'none';

    // This actually shows the browser's real install dialog.
    deferredInstallPrompt.prompt();

    // Wait to see whether the user accepted or dismissed it.
    const choice = await deferredInstallPrompt.userChoice;
    console.log('[App] Install choice:', choice.outcome); // 'accepted' or 'dismissed'

    // This event can only be used once — clear it.
    deferredInstallPrompt = null;
  });

  // When the user clicks the "✕" dismiss button:
  dismissButton.addEventListener('click', () => {
    installBanner.style.display = 'none';
    // Remember the dismissal for this browser session, so it doesn't
    // pop back up every time they navigate within the app.
    sessionStorage.setItem('installBannerDismissed', 'true');
  });

  // Optional: if the app gets installed successfully, hide the banner for good this session
  window.addEventListener('appinstalled', () => {
    installBanner.style.display = 'none';
    console.log('[App] Mumtal Care was installed');
  });
</script>
</body>
</html>
